[package]
name = "qqaf-native"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
publish = false
build = "build.rs"
default-run = "qqaf-native"

[features]
default = []
clean-release = []
slint-prototype = ["dep:slint", "dep:slint-build", "gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

[[bin]]
name = "slint-prototype"
path = "src/bin/slint-prototype.rs"
required-features = ["slint-prototype"]

[dependencies]
slint = { optional = true, version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
wgpu = { optional = true, version = "27", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
pollster = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
