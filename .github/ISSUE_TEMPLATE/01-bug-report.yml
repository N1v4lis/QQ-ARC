name: "🐛 问题反馈"
description: "功能异常、界面问题或配置未生效。安装与记忆问题请优先使用对应分类。"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢参与 QQ ARC Beta 测试。请勿上传 API Key、Token、密码、完整账号数据或私人聊天记录；日志和截图请先脱敏。
  - type: dropdown
    id: severity
    attributes:
      label: 问题严重程度（初步判断）
      description: "按实际影响选择，不确定也可以提交。最终严重程度由维护者核实并添加标签；严重程度与修复优先级分开判断。"
      options:
        - "不确定 — 由维护者判断"
        - "Blocker（阻断）— 无法安装、启动或完成核心流程，且没有可用替代方案"
        - "Critical（严重）— 数据丢失、隐私泄露或安全边界失效"
        - "Major（重大）— 主要功能失效，但其他部分仍可使用"
        - "Minor（次要）— 部分功能异常，有可行替代方式"
        - "Trivial（轻微）— 外观、文案或其他非关键问题"
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QQ ARC 版本
      placeholder: "例如：0.4.6 RC"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 使用方式
      options:
        - Windows Installer (EXE)
        - Portable (ZIP)
        - 开发环境
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: "例如：Windows 11 24H2 / Windows 10 22H2"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 操作步骤
      description: "从哪个页面开始、点击了什么、在什么条件下出现？"
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: "说明是否每次出现，以及是否影响继续使用。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 报错、日志与截图（选填）
      description: "可拖入已脱敏截图，粘贴相关报错。不要上传整个数据目录。"
  - type: textarea
    id: context
    attributes:
      label: 补充信息（选填）
      description: "涉及 SnowLuma、模型供应商或插件时，请附相关版本／模型名称，不要附密钥。"
