<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1ed"><title>酒狐 · 陪你一会儿</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script></head><body>
<main id="room" aria-label="酒狐宠物房间"><div class="room-label"><span class="dot"></span><span>酒狐在这里</span></div><canvas id="pet" tabindex="0" aria-label="可拖动的酒狐。轻点打招呼，2 秒内连续点 3 次会生气。按 Enter 打招呼。"></canvas><div id="bubble" role="status" aria-live="polite" hidden></div><p id="hint">拖一拖她，轻点打个招呼。<span>一直戳的话，她会生气哦。</span></p><div id="loading" role="status"><span class="loader"></span><p id="load-text">酒狐正在过来…</p><button id="retry" hidden>再试一次</button></div></main>

<aside id="settings" hidden aria-label="酒狐设置"><header><div><small>YOUR LITTLE COMPANION</small><h1>陪你一会儿</h1></div><button id="close" aria-label="收起设置">×</button></header><label for="expression">嘴型与表情</label><select id="expression"><option value="-1">自动 · 跟随动作</option><option value="0">普通 · 闭嘴微笑</option><option value="1">开心 · 张嘴笑</option><option value="2">💢 生气</option><option value="3">紧张 · 锯齿嘴</option><option value="4">惊讶 · 大张嘴</option><option value="5">小张嘴</option><option value="6">呆住 · 方眼</option></select><label for="animation">动作</label><select id="animation" disabled><option>等她过来…</option></select><div class="buttons"><button id="pause">暂停动作</button><button id="home">回到原位</button></div><label for="size">大小 <output id="size-label">100%</output></label><input id="size" type="range" min="65" max="150" value="100" step="5"><p class="tip">2 秒内连续轻点 3 次，她会生气。<br>给她 6 秒安静时间，就会消气。</p><footer><a href="./models/SOURCE.txt" target="_blank" rel="noopener">模型作者与许可</a><span>酒狐 · CC BY-NC-SA 4.0</span></footer></aside>
